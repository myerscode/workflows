# Example consumer workflow for Dependabot auto-merge.
#
# Copy this into a repo as `.github/workflows/dependabot-auto-merge.yml`.
#
# IMPORTANT:
#   * Trigger on `pull_request_target` (NOT `pull_request`). Dependabot runs
#     pull_request with a read-only token and no secrets, so it cannot merge.
#     pull_request_target runs in the base repo with a writable token.
#     This workflow never checks out or executes PR code, so that is safe here.
#   * Enable Settings > General > "Allow auto-merge" in the repo.
#   * Add branch protection with required status checks on the default branch,
#     or --auto will merge immediately with nothing to wait on.

name: Dependabot auto-merge

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    uses: myerscode/workflows/.github/workflows/dependabot-auto-merge.yml@v1
    with:
      merge-method: squash
      highest-auto-merge: minor   # patch | minor | major
      approve: true
      resolve-conflicts: recreate # rebase | recreate | off
      ignore-indirect: true       # direct-dep majors still block; indirect ones do not
