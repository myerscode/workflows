# Copy into a repo as `.github/workflows/pr-hygiene.yml`.
# pull_request_target gives the writable token needed to comment/close.

name: PR Hygiene

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  hygiene:
    uses: myerscode/workflows/.github/workflows/pr-hygiene.yml@v1
