# Copy into a PHP package as `.github/workflows/release.yml`.
# The caller owns the triggers; the shared workflow does the work.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2026.0.0 or 1.2.3)'
        required: true
        type: string
      scheme:
        description: 'Version scheme'
        required: true
        type: choice
        options:
          - calver
          - semver
        default: calver
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'      # SemVer
      - '[0-9][0-9][0-9][0-9].*'    # CalVer

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: myerscode/workflows/.github/workflows/php-release.yml@v1
    with:
      version: ${{ github.event.inputs.version }}
      scheme: ${{ github.event.inputs.scheme }}
    secrets:
      PAT: ${{ secrets.PAT }}
