name: Dependabot Auto-merge (reusable)

# Reusable workflow that auto-merges Dependabot pull requests once all
# required status checks pass and the branch is free of conflicts.
#
# GitHub completes a `--auto` merge only when branch protection's required
# checks are green AND the PR has no merge conflicts, so "merge only if there
# are no conflicts" is enforced by GitHub itself at merge time.
#
# Call it from a consumer repo. The caller MUST trigger on pull_request_target
# so the run has a writable token (Dependabot's own pull_request token is
# read-only and sees no secrets):
#
#   name: Dependabot auto-merge
#   on:
#     pull_request_target:
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     automerge:
#       uses: myerscode/workflows/.github/workflows/dependabot-auto-merge.yml@v1
#
# Requirements in the consumer repo:
#   - Settings > General > "Allow auto-merge" enabled.
#   - Branch protection on the default branch with required status checks,
#     otherwise --auto merges immediately with no gate.

on:
  workflow_call:
    inputs:
      merge-method:
        description: 'Merge method: merge, squash, or rebase.'
        type: string
        default: 'squash'
      highest-auto-merge:
        description: >-
          Highest semver bump to auto-merge: patch, minor, or major.
          patch  -> only patch updates.
          minor  -> patch and minor updates.
          major  -> everything (not recommended).
        type: string
        default: 'minor'
      approve:
        description: 'Whether to also submit an approving review.'
        type: boolean
        default: true
      resolve-conflicts:
        description: >-
          How to handle a PR that cannot merge as-is:
          rebase   -> ask Dependabot to rebase (fixes a behind branch; a true
                      conflict stays dirty and is left for a human).
          recreate -> rebase when behind, and rebuild the branch from scratch
                      when dirty (discards any manual commits on the PR branch).
          off      -> do nothing; leave stuck PRs alone.
        type: string
        default: 'recreate'
      ignore-indirect:
        description: >-
          When true (default), judge the semver cap against DIRECT dependencies
          only. Dependabot often pulls a transitive (indirect) dependency to a
          new major as an ancestor of a direct minor/patch bump; with this on,
          that indirect major does not block auto-merge — only the versions you
          directly depend on count. Set false to let any bump, direct or
          indirect, count toward the cap.
        type: boolean
        default: true

# Single-instance guarantee: all Dependabot auto-merge runs for a given repo
# share one concurrency group and queue rather than cancel, so simultaneously
# opened Dependabot PRs are processed one at a time and none are dropped.
concurrency:
  group: dependabot-auto-merge-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only ever act on Dependabot's own PRs.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this update is eligible
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          UPDATED_DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
          HIGHEST: ${{ inputs.highest-auto-merge }}
          IGNORE_INDIRECT: ${{ inputs.ignore-indirect }}
        run: |
          # Rank of the highest bump we are allowed to auto-merge.
          case "$HIGHEST" in
            patch) cap=1 ;;
            minor) cap=2 ;;
            major) cap=3 ;;
            *) echo "Invalid highest-auto-merge: $HIGHEST" >&2; exit 1 ;;
          esac

          rank() {
            case "$1" in
              version-update:semver-patch) echo 1 ;;
              version-update:semver-minor) echo 2 ;;
              version-update:semver-major) echo 3 ;;
              *) echo 99 ;;  # unknown -> never auto-merge (fail closed)
            esac
          }

          deps="${UPDATED_DEPS:-[]}"
          if [ "$(echo "$deps" | jq 'length')" -gt 0 ]; then
            # Prefer the structured per-dependency list — it is type-aware and
            # covers both single and grouped PRs. Optionally drop indirect deps
            # so a transitive major riding along with a direct minor/patch does
            # not block auto-merge.
            if [ "$IGNORE_INDIRECT" = "true" ]; then
              filter='[.[] | select(.dependencyType | startswith("direct"))]'
              scope="direct deps"
            else
              filter='.'
              scope="all deps"
            fi
            considered=$(echo "$deps" | jq -c "$filter")
            n=$(echo "$considered" | jq 'length')
            if [ "$n" -eq 0 ]; then
              # ignore-indirect removed everything (all deps indirect): the PR
              # only moves transitive deps — judge by their highest bump instead
              # of failing closed.
              considered=$(echo "$deps" | jq -c '.')
              scope="all deps (no direct present)"
            fi
            highest_rank=0
            while IFS= read -r t; do
              r=$(rank "$t")
              [ "$r" -gt "$highest_rank" ] && highest_rank=$r
            done <<< "$(echo "$considered" | jq -r '.[].updateType // empty')"
            [ "$highest_rank" -eq 0 ] && highest_rank=99
            detail="$scope (highest rank $highest_rank)"
          else
            # No structured list (older metadata) — fall back to update-type.
            highest_rank=$(rank "$UPDATE_TYPE")
            detail="${UPDATE_TYPE:-unknown}"
          fi

          if [ "$highest_rank" -le "$cap" ]; then eligible=true; else eligible=false; fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "Update '$detail' (rank $highest_rank) eligible under '$HIGHEST' (cap $cap): $eligible"

      - name: Approve the pull request
        if: steps.gate.outputs.eligible == 'true' && inputs.approve
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge
        if: steps.gate.outputs.eligible == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METHOD: ${{ inputs.merge-method }}
        run: gh pr merge --auto --"$METHOD" "$PR_URL"

      - name: Resolve a stuck (behind or conflicted) PR
        # Runs for eligible PRs even once auto-merge is armed: --auto completes
        # only after the branch is up to date and conflict-free, so a BEHIND or
        # DIRTY branch must be refreshed by Dependabot for the merge to land.
        if: steps.gate.outputs.eligible == 'true' && inputs.resolve-conflicts != 'off'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRATEGY: ${{ inputs.resolve-conflicts }}
        run: |
          # mergeStateStatus is computed lazily; poll briefly until it resolves.
          state=""
          for i in 1 2 3 4 5; do
            state=$(gh pr view "$PR_NUMBER" --json mergeStateStatus -q .mergeStateStatus)
            [ "$state" != "UNKNOWN" ] && break
            echo "mergeStateStatus UNKNOWN, waiting... ($i)"; sleep 5
          done
          echo "mergeStateStatus=$state"

          case "$state" in
            BEHIND)
              # Base moved ahead; a rebase brings the branch current.
              echo "Branch is behind base - asking Dependabot to rebase."
              gh pr comment "$PR_URL" --body "@dependabot rebase"
              ;;
            DIRTY)
              # True merge conflict. rebase cannot fix it; recreate rebuilds the
              # branch from scratch (only safe on Dependabot-owned branches).
              if [ "$STRATEGY" = "recreate" ]; then
                echo "Branch is dirty - asking Dependabot to recreate."
                gh pr comment "$PR_URL" --body "@dependabot recreate"
              else
                echo "Branch is dirty and resolve-conflicts=rebase; leaving for a human."
                gh pr comment "$PR_URL" --body \
                  "This PR has merge conflicts Dependabot cannot auto-resolve. Comment \`@dependabot recreate\` to rebuild it, or resolve manually."
              fi
              ;;
            CLEAN|HAS_HOOKS|UNSTABLE|BLOCKED)
              echo "State '$state' needs no rebase; auto-merge will proceed once checks settle."
              ;;
            *)
              echo "State '$state' - no action taken."
              ;;
          esac
