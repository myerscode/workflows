name: Dependabot Auto-merge (reusable)

# Reusable workflow that auto-merges Dependabot pull requests once all
# required status checks pass and the branch is free of conflicts.
#
# GitHub completes a `--auto` merge only when branch protection's required
# checks are green AND the PR has no merge conflicts, so "merge only if there
# are no conflicts" is enforced by GitHub itself at merge time.
#
# Call it from a consumer repo. The caller MUST trigger on pull_request_target
# so the run has a writable token (Dependabot's own pull_request token is
# read-only and sees no secrets):
#
#   name: Dependabot auto-merge
#   on:
#     pull_request_target:
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     automerge:
#       uses: myerscode/workflows/.github/workflows/dependabot-auto-merge.yml@v1
#
# Requirements in the consumer repo:
#   - Settings > General > "Allow auto-merge" enabled.
#   - Branch protection on the default branch with required status checks,
#     otherwise --auto merges immediately with no gate.

on:
  workflow_call:
    inputs:
      merge-method:
        description: 'Merge method: merge, squash, or rebase.'
        type: string
        default: 'squash'
      highest-auto-merge:
        description: >-
          Highest semver bump to auto-merge: patch, minor, or major.
          patch  -> only patch updates.
          minor  -> patch and minor updates.
          major  -> everything (not recommended).
        type: string
        default: 'minor'
      approve:
        description: 'Whether to also submit an approving review.'
        type: boolean
        default: true

# Single-instance guarantee: all Dependabot auto-merge runs for a given repo
# share one concurrency group and queue rather than cancel, so simultaneously
# opened Dependabot PRs are processed one at a time and none are dropped.
concurrency:
  group: dependabot-auto-merge-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only ever act on Dependabot's own PRs.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this update is eligible
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          UPDATED_DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
          HIGHEST: ${{ inputs.highest-auto-merge }}
        run: |
          # Rank of the highest bump we are allowed to auto-merge.
          case "$HIGHEST" in
            patch) cap=1 ;;
            minor) cap=2 ;;
            major) cap=3 ;;
            *) echo "Invalid highest-auto-merge: $HIGHEST" >&2; exit 1 ;;
          esac

          rank() {
            case "$1" in
              version-update:semver-patch) echo 1 ;;
              version-update:semver-minor) echo 2 ;;
              version-update:semver-major) echo 3 ;;
              *) echo 99 ;;  # unknown / direct-dependency updates -> never auto-merge
            esac
          }

          # Single-dependency PRs expose update-type directly. Grouped PRs leave
          # it empty and instead list every bump in updated-dependencies-json;
          # for those, take the HIGHEST bump across the group.
          if [ -n "$UPDATE_TYPE" ]; then
            highest_rank=$(rank "$UPDATE_TYPE")
            detail="$UPDATE_TYPE"
          else
            highest_rank=0
            while IFS= read -r t; do
              r=$(rank "$t")
              [ "$r" -gt "$highest_rank" ] && highest_rank=$r
            done <<< "$(echo "${UPDATED_DEPS:-[]}" | jq -r '.[].updateType // empty')"
            [ "$highest_rank" -eq 0 ] && highest_rank=99   # no parsable types -> fail closed
            detail="grouped (highest rank $highest_rank)"
          fi

          if [ "$highest_rank" -le "$cap" ]; then eligible=true; else eligible=false; fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "Update '$detail' (rank $highest_rank) eligible under '$HIGHEST' (cap $cap): $eligible"

      - name: Approve the pull request
        if: steps.gate.outputs.eligible == 'true' && inputs.approve
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge
        if: steps.gate.outputs.eligible == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METHOD: ${{ inputs.merge-method }}
        run: gh pr merge --auto --"$METHOD" "$PR_URL"
