name: PHP Release (reusable)

# Reusable release workflow for myerscode PHP packages: validates the version,
# tags it, generates a changelog from conventional commits, creates the GitHub
# release (changelog embedded as release notes), and lands the updated
# CHANGELOG.md on the default branch via an auto-merged pull request (the
# branch forbids direct pushes).
#
# Supports CalVer (YYYY.MINOR.PATCH) and SemVer (MAJOR.MINOR.PATCH).
#
# The CALLER owns the triggers (workflow_dispatch inputs and/or a tag push) and
# passes them through. Example consumer in examples/consumer-php-release.yml.
#
#   jobs:
#     release:
#       uses: myerscode/workflows/.github/workflows/php-release.yml@v1
#       with:
#         version: ${{ inputs.version }}
#         scheme: ${{ inputs.scheme }}
#       secrets:
#         # Optional. A PAT lets the release commit bypass branch protection and
#         # trigger downstream workflows; omit to fall back to GITHUB_TOKEN.
#         PAT: ${{ secrets.PAT }}

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release, or empty to derive from a pushed tag.'
        type: string
        default: ''
      scheme:
        description: 'Version scheme: calver or semver. Auto-detected for a tag push.'
        type: string
        default: 'calver'
      default-branch:
        description: 'Branch to tag from and commit the CHANGELOG to.'
        type: string
        default: 'main'
      exclude-types:
        description: 'Conventional-commit types excluded from the changelog.'
        type: string
        default: 'build,docs,other,style,ci,chore'
    secrets:
      PAT:
        description: 'Optional PAT so release commits bypass branch protection / fire downstream workflows.'
        required: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

# contents: write to tag + create the release; pull-requests: write to open the
# auto-merged CHANGELOG PR (the default branch forbids direct pushes). The
# caller's release.yml must grant BOTH.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
          token: ${{ secrets.PAT || github.token }}
          persist-credentials: true

      - name: Determine version and scheme
        id: version
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_SCHEME: ${{ inputs.scheme }}
        run: |
          if [ -n "$IN_VERSION" ]; then
            TAG="$IN_VERSION"
            SCHEME="$IN_SCHEME"
          else
            # Derive from the pushed tag ref; auto-detect scheme.
            TAG="${GITHUB_REF_NAME}"
            if echo "$TAG" | grep -qE '^[0-9]{4}\.[0-9]+\.[0-9]+$'; then
              SCHEME="calver"
            else
              SCHEME="semver"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Validate version format
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SCHEME: ${{ steps.version.outputs.scheme }}
        run: |
          if [ "$SCHEME" = "calver" ]; then
            if ! echo "$TAG" | grep -qE '^[0-9]{4}\.[0-9]+\.[0-9]+$'; then
              echo "Error: Version must be CalVer YYYY.MINOR.PATCH (e.g. 2026.0.0)"; exit 1
            fi
          else
            if ! echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Error: Version must be SemVer MAJOR.MINOR.PATCH (e.g. 1.2.3)"; exit 1
            fi
          fi

      - name: Create and push tag
        # Only when invoked with an explicit version (dispatch); a tag push
        # already created the tag.
        if: inputs.version != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Get previous tag
        id: previous
        env:
          CURRENT: ${{ steps.version.outputs.tag }}
        run: |
          PREVIOUS=$(git tag --list --sort=-version:refname '[0-9]*' | grep -v "^${CURRENT}$" | head -1)
          if [ -n "$PREVIOUS" ]; then
            echo "tag=$PREVIOUS" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        if: steps.previous.outputs.found == 'true'
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          fromTag: ${{ steps.version.outputs.tag }}
          toTag: ${{ steps.previous.outputs.tag }}
          excludeTypes: ${{ inputs.exclude-types }}
          useGitmojis: false
          writeToFile: false

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.changes || 'Initial release' }}

      - name: Write changelog to file
        if: steps.previous.outputs.found == 'true'
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          fromTag: ${{ steps.version.outputs.tag }}
          toTag: ${{ steps.previous.outputs.tag }}
          excludeTypes: ${{ inputs.exclude-types }}
          useGitmojis: false
          writeToFile: true

      # The default branch forbids direct pushes (org baseline ruleset requires
      # a pull request), so land the regenerated CHANGELOG via an auto-merged
      # PR rather than committing straight to the branch.
      - name: Open CHANGELOG pull request
        if: steps.previous.outputs.found == 'true'
        id: changelog_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT || github.token }}
          branch: changelog/${{ steps.version.outputs.tag }}
          base: ${{ inputs.default-branch }}
          commit-message: "docs: update CHANGELOG for ${{ steps.version.outputs.tag }}"
          title: "docs: update CHANGELOG for ${{ steps.version.outputs.tag }}"
          body: |
            Automated CHANGELOG update for release `${{ steps.version.outputs.tag }}`.

            Opened by the reusable `php-release` workflow because the default
            branch requires a pull request (no direct pushes).
          add-paths: CHANGELOG.md
          delete-branch: true

      # The GitHub release above already carries the changelog as its release
      # notes (from the in-memory "Generate changelog" step), so the release is
      # never missing its changelog. This step only lands the CHANGELOG.md file
      # into the repo history. The baseline ruleset requires 0 approvals and no
      # status checks, so merge immediately; fall back to --auto if the repo has
      # checks that must pass first.
      - name: Merge the CHANGELOG PR
        if: steps.previous.outputs.found == 'true' && steps.changelog_pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.PAT || github.token }}
          PR: ${{ steps.changelog_pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            || gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --auto
